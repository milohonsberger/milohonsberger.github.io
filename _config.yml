title: Milo Honsberger
description: >-
  Mapping, geospatial analysis, and remote sensing portfolio — web maps,
  Google Earth Engine applications, and static cartography.
author: Milo Honsberger
email: honsbergermilo@gmail.com
baseurl: ""
url: ""

# Set this to your GitHub username/repo if it differs from <user>.github.io
github_username: milohonsberger

markdown: kramdown
permalink: /:categories/:title/

collections:
  projects:
    output: true
    permalink: /projects/:path/

# Portfolio sections, in display order. `type` is matched against each
# project's `type:` front matter. To add a new format (StoryMap, dashboard,
# report, ...) just add an entry here — no template changes needed.
# Projects whose type matches nothing here fall into a catch-all section, so
# nothing ever silently disappears.
project_categories:
  - type: webmap
    title: Web Maps
    note: Interactive maps built in Jupyter (Folium / ipyleaflet), linked out to a rendered notebook.
  - type: gee
    title: Google Earth Engine
    note: Published Earth Engine Apps for interactive geospatial analysis.
  - type: staticmap
    title: Static Maps
    note: Cartography produced in QGIS/ArcGIS or Python (Matplotlib/GeoPandas).

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
  - scope:
      path: ""
    values:
      layout: default
  # Assets must never be wrapped in a layout — doing so serves an HTML page
  # at the .css/.js URL. This overrides the blanket default above (more
  # specific path wins). Assets should also just omit front matter entirely.
  - scope:
      path: "assets"
    values:
      layout: none

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docker-compose.yml
  - node_modules
  - vendor
